name: SourceMod Build

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - "channel/*"
  pull_request:
    paths:
      - .gitattributes
      - scripts/**
      - Makefile
      - addons/sourcemod/**
      - README.md
      - LICENSE
      - NOTICES.md
      - CHANGELOG.md
      - .github/workflows/**
  workflow_dispatch:

concurrency:
  group: sourcemod-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOURCEMOD_VERSION: ${{ vars.SOURCEMOD_VERSION }}

jobs:
  deps-smx:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Validate organization SourceMod version
        shell: bash
        run: |
          if [[ ! "$SOURCEMOD_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Set the AoC-Gamers Actions variable SOURCEMOD_VERSION to a SourceMod branch such as 1.12."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 make

      - name: Show SourceMod version
        run: |
          echo "SOURCEMOD_VERSION=${SOURCEMOD_VERSION}"

      - name: Resolve dependency cache key
        id: cache-key
        shell: bash
        run: |
          echo "key=smx-deps-${{ runner.os }}-${{ env.SOURCEMOD_VERSION }}-${{ hashFiles('scripts/deps/fetch-sourcemod.py', 'scripts/build/build-local.py', 'scripts/package/stage-artifact.py', 'scripts/package/package-release.py', 'scripts/package/package-map.json', 'Makefile') }}" >> "$GITHUB_OUTPUT"

      - name: Restore dependency cache
        id: deps-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: .deps/smx
          key: ${{ steps.cache-key.outputs.key }}

      - name: Fetch SourceMod dependencies
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        run: make deps-smx PYTHON=python3 SOURCEMOD_VERSION="${SOURCEMOD_VERSION}" SMX_PLATFORM=linux

      - name: Save dependency cache
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .deps/smx
          key: ${{ steps.cache-key.outputs.key }}

  build-smx:
    runs-on: ubuntu-latest
    needs: deps-smx

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 make

      - name: Restore dependency cache
        uses: actions/cache/restore@v5
        with:
          path: .deps/smx
          key: ${{ needs.deps-smx.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Build SMX
        run: make build-smx PYTHON=python3

      - name: Upload SMX build tree
        uses: actions/upload-artifact@v6
        with:
          name: smx-build
          path: .build/smx
          if-no-files-found: error
          retention-days: 1

      - name: Upload compile log
        uses: actions/upload-artifact@v6
        with:
          name: smx-compile-log
          path: .build/build-smx-compile.log
          if-no-files-found: error
          retention-days: 1

  package:
    runs-on: ubuntu-latest
    needs: build-smx
    outputs:
      basename: ${{ steps.artifact.outputs.basename }}
      enabled: ${{ steps.artifact.outputs.enabled }}
      tag: ${{ steps.artifact.outputs.tag }}
      title: ${{ steps.artifact.outputs.title }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 make

      - name: Download SMX build tree
        uses: actions/download-artifact@v8
        with:
          name: smx-build
          path: .build/smx

      - name: Package SMX tree
        run: make package-smx PYTHON=python3

      - name: Resolve artifact name
        id: artifact
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            main|master)
              echo "basename=afk-on-readyup-latest" >> "$GITHUB_OUTPUT"
              echo "tag=channel/latest" >> "$GITHUB_OUTPUT"
              echo "title=AFK on ReadyUp latest" >> "$GITHUB_OUTPUT"
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            develop)
              echo "basename=afk-on-readyup-develop" >> "$GITHUB_OUTPUT"
              echo "tag=channel/develop" >> "$GITHUB_OUTPUT"
              echo "title=AFK on ReadyUp develop" >> "$GITHUB_OUTPUT"
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "basename=afk-on-readyup-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Package zip
        run: make release PYTHON=python3 RELEASE_BASENAME="${{ steps.artifact.outputs.basename }}"

      - name: Upload release zip
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.artifact.outputs.basename }}
          path: dist/release/${{ steps.artifact.outputs.basename }}.zip
          if-no-files-found: error
          retention-days: 14

  publish-channel:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download validated ZIP
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.basename }}
          path: dist/release

      - name: Publish channel release
        if: needs.package.outputs.enabled == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ needs.package.outputs.tag }}" "$GITHUB_SHA"
          git push origin "refs/tags/${{ needs.package.outputs.tag }}" --force

      - name: Upload channel asset
        if: needs.package.outputs.enabled == 'true' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.package.outputs.tag }}
          name: ${{ needs.package.outputs.title }}
          files: dist/release/${{ needs.package.outputs.basename }}.zip
          draft: false
          prerelease: ${{ needs.package.outputs.tag == 'channel/develop' }}
          make_latest: ${{ needs.package.outputs.tag == 'channel/latest' }}
